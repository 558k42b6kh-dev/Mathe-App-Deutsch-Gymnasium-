<li>Wie viel Beton für ein Fundament?</li>
</ul>
<div class="beispiel">Ein Schwimmbecken 10 m × 5 m × 1,5 m fasst 75 m³ = 75 000 Liter Wasser.</div>
<p>Immer auf die Einheiten achten (cm, dm oder m)!</p>`,
gen:{
einstieg:(i)=>{const a=ri(2,10),b=ri(2,8),c=ri(2,6);return F(`Schachtel ${a}×${b}×${c} cm. V in cm³:`,a*b*c,`${a*b*c}.`,'L·B·H.');},
grundlagen:(i)=>{const a=ri(5,25),b=ri(3,12),c=ri(1,4);return F(`Becken ${a}×${b}×${c} m. V in m³:`,a*b*c,`${a*b*c} m³.`,'Gleiche Einheiten.');},
fortgeschritten:(i)=>{const G=ri(3,20),h=ri(2,10);return F(`Prisma G=${G} m², h=${h} m. V in m³:`,G*h,`${G*h}.`,'V = G·h.');},
experten:(i)=>{const a=ri(2,10);return F(`Würfel V=${a*a*a} cm³. a = ? cm`,a,`a³ = ${a*a*a} → a = ${a}.`,'Dritte Wurzel.');},
multistep:(i)=>{const a=ri(10,25),b=ri(5,12),c=ri(2,5);return MS(`Schwimmbecken ${a} m × ${b} m × ${c} m.`,
[{q:`Volumen in m³:`,a:String(a*b*c),e:`${a*b*c}`},
{q:`Volumen in Liter:`,a:String(a*b*c*1000),e:`${a*b*c*1000} L`},
{q:`Wie viel Wasser passt rein, wenn es nur zu 80 % gefüllt wird? (in m³)`,a:(0.8*a*b*c).toFixed(0),e:`0,8·${a*b*c} = ${(0.8*a*b*c).toFixed(0)}`}],
`Becken-Aufgabe in mehreren Schritten.`,'V = a·b·c, dann Umrechnung.');}
}}
}}
}},
b3:{name:"Variablen und Funktionen",icon:"⚖️",kapitel:{
k9:{name:"Gleichungen und Formeln",icon:"🟰",unter:{
u1:{name:"Terme aufstellen",
e:`<h3>Terme aufstellen</h3>
<p>Ein Term ist ein Rechenausdruck mit Zahlen und Variablen (Buchstaben).</p>
<ul style="margin:8px 0 8px 20px">
<li>„das n-fache“ → n · x oder nx</li>
<li>„vermehrt um“ → plus</li>
<li>„vermindert um“ → minus</li>
<li>„Summe aus … und …“ → plus</li>
</ul>
<div class="beispiel"><b>Beispiel:</b> „Das 3-fache einer Zahl x vermehrt um 5“ → 3x + 5</div>
<p>Achte auf die Reihenfolge und setze keine unnötigen Leerzeichen, wenn du den Term eingibst.</p>`,
gen:{
einstieg:(i)=>{const n=ri(2,9);return MC(`Was bedeutet „das <b>${n}-fache</b> einer Zahl x“?`,`${n}x`,[`x+${n}`,`x^${n}`,`x:${n}`],`${n}·x.`,'n-fache = n·x.');},
grundlagen:(i)=>{const n=ri(2,15);return F(`Term: „x vermindert um ${n}“`,`x-${n}`,`x − ${n}.`,'vermindert = minus.');},
fortgeschritten:(i)=>{const n=ri(2,9),m=ri(2,9);return F(`Term: „${n}-fache von x vermehrt um ${m}“`,`${n}x+${m}`,`${n}x + ${m}.`,'Reihenfolge.');},
experten:(i)=>{const n=ri(2,9),m=ri(2,9);return F(`Term: „Summe aus ${n}-fachem von x und ${m}-fachem von y“`,`${n}x+${m}y`,`${n}x + ${m}y.`,'Mehrere Variablen.');},
multistep:(i)=>{const n=ri(2,7);return MS(`Übersetze in einen Term: <i>„Bilde das ${n}-fache einer Zahl x und vermindere um 5.“</i>`,
[{q:`Term (ohne Leerzeichen):`,a:`${n}x-5`,e:`${n}x − 5`,alt:[`${n}x - 5`,`${n}*x-5`]},
{q:`Setze x = 4 ein. Ergebnis?`,a:String(n*4-5),e:`${n}·4 − 5 = ${n*4-5}`},
{q:`Setze x = 10 ein. Ergebnis?`,a:String(n*10-5),e:`${n*10-5}`}],
`Term aufstellen und auswerten.`,'Koeffizient vor der Variablen.');}
}},
u2:{name:"Lineare Gleichungen lösen",
e:`<h3>Lineare Gleichungen lösen</h3>
<p>Bei einer linearen Gleichung willst du herausfinden, welche Zahl für x eingesetzt werden muss, damit die Gleichung stimmt.</p>
<p>Du benutzt immer die <b>Umkehroperation</b>:</p>
<ul style="margin:8px 0 8px 20px">
<li>+ wird zu −</li>
<li>− wird zu +</li>
<li>· wird zu :</li>
<li>: wird zu ·</li>
</ul>
<div class="beispiel"><b>Beispiel:</b> 3x + 4 = 19<br>
3x = 15 (minus 4)<br>
x = 5 (geteilt durch 3)</div>
<p>Mach am Ende immer eine Probe!</p>`,
gen:{
einstieg:(i)=>{const x=ri(1,20),a=ri(1,20);return F(`x + ${a} = ${x+a}. x = ?`,x,`x = ${x}.`,'Umkehrung −.');},
grundlagen:(i)=>{const x=ri(1,15),a=ri(2,9);return F(`${a}x = ${a*x}. x = ?`,x,`x = ${x}.`,'Umkehrung :.');},
fortgeschritten:(i)=>{const x=ri(1,15),a=ri(2,9),b=ri(1,20);return F(`${a}x + ${b} = ${a*x+b}. x = ?`,x,`x = ${x}.`,'Erst −, dann :.');},
experten:(i)=>{const x=ri(1,10),a=ri(3,7),b=ri(1,10),c=ri(1,a-1),d=ri(1,20);return F(`${a}x − ${b} = ${c}x + ${d}. x = ?`,x,`(${a}−${c})x = ${d}+${b} → x = ${x}.`,'Variablen trennen.');},
multistep:(i)=>{const x=ri(2,10),a=ri(2,5),b=ri(1,15);return MS(`Löse <b>${a}x + ${b} = ${a*x+b}</b> schrittweise.`,
[{q:`Subtrahiere ${b}: ${a}x = ?`,a:String(a*x),e:`${a*x}`},
{q:`Dividiere durch ${a}: x = ?`,a:String(x),e:`x = ${x}`},
{q:`Probe: ${a}·x + ${b} = ?`,a:String(a*x+b),e:`${a*x+b}`}],
`Gleichung lösen mit Probe.`,'Erst +/−, dann ·/:');}
}},
u3:{name:"Gleichungen aus Textaufgaben",
e:`<h3>Gleichungen aus Textaufgaben</h3>
<p>So gehst du vor:</p>
<ol style="margin:8px 0 8px 20px">
<li>Variable festlegen (z. B. x = die gesuchte Zahl)</li>
<li>Den Text in eine Gleichung übersetzen</li>
<li>Die Gleichung lösen</li>
<li>Probe machen und die Antwort im Satz formulieren</li>
</ol>
<div class="beispiel"><b>Beispiel:</b> „Das 4-fache einer Zahl vermehrt um 6 ergibt 30.“<br>
4x + 6 = 30 → x = 6</div>`,
gen:{
einstieg:(i)=>{const x=ri(1,15),a=ri(2,15);return F(`x vermehrt um ${a} ergibt ${x+a}. x = ?`,x,`x = ${x}.`,'Wort → Gleichung.');},
grundlagen:(i)=>{const x=ri(2,12),a=ri(2,9);return F(`Das ${a}-fache einer Zahl ist ${a*x}. x = ?`,x,`x = ${x}.`,'n-fache → n·x.');},
fortgeschritten:(i)=>{const x=ri(3,12),a=ri(2,6),b=ri(2,10);return F(`Das ${a}-fache einer Zahl vermehrt um ${b} ergibt ${a*x+b}. x = ?`,x,`${a}x+${b}=${a*x+b} → x=${x}.`,'Schrittweise.');},
experten:(i)=>{const v=ri(30,45),s=ri(5,12);const x=v-2*s;return F(`Vater ${v}, Sohn ${s}. In wie vielen Jahren ist der Vater doppelt so alt?`,x,`${v}+x = 2(${s}+x) → x = ${x}.`,'Beide +x.');},
multistep:(i)=>{const x=ri(3,10),a=ri(2,5),b=ri(2,15);return MS(`Löse die Textaufgabe: <i>„Das ${a}-fache einer Zahl vermehrt um ${b} ergibt ${a*x+b}.“</i>`,
[{q:`Gleichung (z.B. 3x+5=20):`,a:`${a}x+${b}=${a*x+b}`,e:`${a}x + ${b} = ${a*x+b}`,alt:[`${a}x + ${b} = ${a*x+b}`]},
{q:`${a}x = ?`,a:String(a*x),e:`${a*x}`},
{q:`x = ?`,a:String(x),e:`x = ${x}`},
{q:`Probe: ${a}·x+${b} = ?`,a:String(a*x+b),e:`${a*x+b}`}],
`Textaufgabe systematisch lösen.`,'Variable einführen.');}
}},
u4:{name:"Formeln umformen",
e:`<h3>Formeln umformen</h3>
<p>Manchmal kennst du die Formel, brauchst aber eine andere Größe. Dann löst du die Formel nach der gesuchten Größe auf – genau wie bei Gleichungen mit Umkehroperationen.</p>
<div class="beispiel"><b>Beispiele:</b><br>
A = a · b → b = A / a<br>
V = G · h → G = V / h<br>
A = (a+c)/2 · h → a = 2A/h − c</div>
<p>Schreibe jeden Schritt auf, dann verlierst du nicht den Überblick.</p>`,
gen:{
einstieg:(i)=>{return F(`A = a·b. Löse nach b: b = A/?`,'a','b = A/a.','Umkehroperation.');},
grundlagen:(i)=>{return F(`U = 2(a+b). Nach b: b = U/2 − ?`,'a','b = U/2 − a.');},
fortgeschritten:(i)=>{return F(`A = (a+c)/2·h. Nach a: a = 2A/h − ?`,'c','a = 2A/h − c.');},
experten:(i)=>{return F(`V = G·h. Nach G: G = V/?`,'h','G = V/h.');},
multistep:(i)=>{const A=ri(20,60),h=ri(2,8);const a=A/h;return MS(`Trapez: A = ${A} cm², h = ${h} cm, c = 0 cm (Dreieck).`,
[{q:`Formel nach a umgestellt: a = ?`,a:'2A/h',e:'a = 2A/h',alt:['2*A/h','2A/h']},
{q:`a in cm:`,a:String(2*a),e:`2·${A}/${h} = ${2*a}`},
{q:`Überprüfe: 2A/h − 0 = a → a = ?`,a:String(2*a),e:`${2*a}`}],
`Formel umformen und anwenden.`,'Umkehroperationen.');}
}},
u5:{name:"Gleichungen mit Brüchen und Dezimalzahlen",
e:`<h3>Gleichungen mit Brüchen und Dezimalzahlen</h3>
<p>Bei Brüchen in Gleichungen multiplizierst du am besten mit dem Nenner, um den Bruch wegzubekommen.</p>
<p>Bei Dezimalzahlen kannst du sie als Bruch schreiben oder einfach rechnen.</p>
<div class="beispiel"><b>Beispiel:</b> x/4 + 3 = 7<br>
x/4 = 4<br>
x = 16</div>
<p>Immer zuerst die Addition/Subtraktion, dann die Multiplikation/Division.</p>`,
gen:{
einstieg:(i)=>{const n=ri(2,9),x=ri(1,12);return F(`x/${n} = ${x}. x = ?`,x*n,`x = ${x*n}.`,'Mit Nenner multiplizieren.');},
grundlagen:(i)=>{const d=pick([0.2,0.4,0.5,0.25]),x=ri(2,15);return F(`${d.toString().replace('.',',')}x = ${(d*x).toFixed(2).replace('.',',')}. x = ?`,x,`x = ${x}.`,'Durch Dezimalwert.');},
fortgeschritten:(i)=>{const n=ri(2,6),a=ri(1,9),x=ri(2,15);return F(`x/${n} + ${a} = ${x/n+a}. x = ?`,x,`x = ${x}.`,'Erst −, dann ·Nenner.');},
experten:(i)=>{const z=ri(2,5),n=ri(z+1,7),x=ri(2,12);const b=z*x/n;return F(`(${z}/${n})x = ${b}. x = ?`,x,`x = ${b} · ${n}/${z} = ${x}.`,'Kehrwert multiplizieren.');},
multistep:(i)=>{const n=ri(3,6),x=ri(2,12),a=ri(1,10);return MS(`Löse <b>x/${n} + ${a} = ${x/n+a}</b> schrittweise.`,
[{q:`Subtrahiere ${a}: x/${n} = ?`,a:String(x/n),e:`${x/n}`},
{q:`Multipliziere mit ${n}: x = ?`,a:String(x),e:`x = ${x}`},
{q:`Probe: x/${n}+${a} = ?`,a:String(x/n+a),e:`${x/n+a}`}],
`Gleichung mit Bruch.`,'Erst +/−, dann ·Nenner.');}
}}
}},
k10:{name:"Proportionalität",icon:"📈",unter:{
u1:{name:"Direkte Proportionalität",
e:`<h3>Direkte Proportionalität</h3>
<p>Bei direkter Proportionalität gilt: <b>Je mehr – desto mehr</b>. Wenn du die eine Größe verdoppelst, verdoppelt sich auch die andere.</p>
<p>Der Graph ist eine Gerade durch den Ursprung. Der Quotient (Einheitswert) bleibt konstant.</p>
<div class="beispiel"><b>Beispiele:</b> Preis und Menge (3 Äpfel kosten 1,50 €, 6 Äpfel kosten 3 €), Weg und Zeit bei konstanter Geschwindigkeit.</div>
<p>Rechenweg: Erst den Einheitswert berechnen (Preis für 1 Stück), dann mit der gewünschten Menge multiplizieren.</p>`,
gen:{
einstieg:(i)=>{const k=ri(1,5),n1=ri(2,8),n2=ri(2,10);return F(`${n1} Stück kosten ${n1*k} €. ${n2} Stück in €:`,n2*k,`${n2}·${k} = ${n2*k}.`,'Erst Einheitswert.');},
grundlagen:(i)=>{const k=ri(2,6),n1=ri(2,8),n2=ri(2,12);return F(`${n1} kg kosten ${n1*k} €. ${n2} kg in €:`,n2*k,`${n2*k} €.`,'Einheitswert.');},
fortgeschritten:(i)=>{const k=ri(3,9),n1=ri(2,8),n2=ri(2,10);return F(`${n1} m kosten ${n1*k} €. ${n2} m in €:`,n2*k,`${n2*k} €.`,'Direkt proportional.');},
experten:(i)=>{const kmh=ri(40,90),h1=ri(2,6),h2=ri(2,8);return F(`Auto: ${kmh*h1} km in ${h1} h. In ${h2} h wie viel km?`,kmh*h2,`${kmh*h2} km.`,'Gleichbleibende Geschw.');},
multistep:(i)=>{const k=ri(2,6),n1=ri(3,8),n2=ri(2,10);return MS(`<b>${n1} kg</b> kosten <b>${n1*k} €</b>. Wie viel kosten <b>${n2} kg</b>?`,
[{q:`Einheitspreis (1 kg) in €:`,a:String(k),e:`${n1*k} : ${n1} = ${k}`},
{q:`${n2} kg kosten in €:`,a:String(n2*k),e:`${n2}·${k} = ${n2*k}`},
{q:`${n2+n1} kg kosten in €:`,a:String((n1+n2)*k),e:`${(n1+n2)*k}`}],
`Direkter Dreisatz.`,'Erst Einheitswert.');}
}},
u2:{name:"Indirekte Proportionalität",
e:`<h3>Indirekte Proportionalität</h3>
<p>Bei indirekter Proportionalität gilt: <b>Je mehr – desto weniger</b>. Das Produkt der beiden Größen bleibt konstant.</p>
<div class="beispiel"><b>Beispiele:</b><br>
• Mehr Arbeiter → weniger Zeit für die gleiche Arbeit<br>
• Mehr Pumpen → weniger Zeit, um ein Becken zu leeren<br>
• Mehr Personen → weniger Tage, bis der Vorrat aufgebraucht ist</div>
<p>Rechenweg: Produkt der bekannten Werte bilden und durch die neue Größe teilen.</p>`,
gen:{
einstieg:(i)=>{const a1=ri(2,6),h1=ri(4,12),a2=a1*ri(2,3);return F(`${a1} Pumpen brauchen ${h1} h. ${a2} Pumpen brauchen ? h`,(a1*h1/a2).toFixed(2),`${(a1*h1/a2).toFixed(2)} h.`,'Produkt konstant.');},
grundlagen:(i)=>{const a1=ri(3,8),t1=ri(6,20),a2=a1+ri(1,6);return F(`${a1} Arbeiter brauchen ${t1} Tage. ${a2} Arbeiter brauchen ? Tage`,(a1*t1/a2).toFixed(2),`${(a1*t1/a2).toFixed(2)} Tage.`,'Indirekt.');},
fortgeschritten:(i)=>{const p1=ri(8,20),t1=ri(15,40),p2=p1+ri(5,15);return F(`Vorrat für ${p1} Personen reicht ${t1} Tage. Für ${p2} Personen ? Tage`,(p1*t1/p2).toFixed(2),`${(p1*t1/p2).toFixed(2)} Tage.`,'p·t konstant.');},
experten:(i)=>{const m1=ri(3,10),h1=ri(4,12),h2=h1+ri(2,8);return F(`${m1} Maschinen brauchen ${h1} h. Für ${h2} h ? Maschinen`,(m1*h1/h2).toFixed(2),`${(m1*h1/h2).toFixed(2)}.`,'Produkt konstant.');},
multistep:(i)=>{const a1=ri(3,8),t1=ri(6,15),a2=a1+ri(2,5);return MS(`<b>${a1} Arbeiter</b> brauchen <b>${t1} Tage</b>. Wie lange brauchen <b>${a2} Arbeiter</b>?`,
[{q:`Produkt Arbeiter·Tage:`,a:String(a1*t1),e:`${a1}·${t1} = ${a1*t1}`},
{q:`Neue Tage: Produkt : ${a2} = ?`,a:(a1*t1/a2).toFixed(2),e:`${a1*t1}/${a2} = ${(a1*t1/a2).toFixed(2)}`},
{q:`Mehr oder weniger Zeit als vorher? (mehr/weniger)`,a:a2>a1?'weniger':'mehr',e:'Mehr Arbeiter → weniger Tage.'}],
`Indirekter Dreisatz.`,'Produkt bleibt konstant.');}
}},
u3:{name:"Schlusssatzaufgaben (Dreisatz)",
e:`<h3>Schlusssatzaufgaben (Dreisatz)</h3>
<p>Der Dreisatz ist eine einfache Methode für proportionale Zusammenhänge:</p>
<ol style="margin:8px 0 8px 20px">
<li>Schluss auf die Einheit (1 Stück, 1 kg, 1 Tag …)</li>
<li>Dann auf die gesuchte Menge schließen</li>
</ol>
<div class="beispiel"><b>Beispiel:</b> 4 kg kosten 12 €. Wie viel kosten 7 kg?<br>
1 kg kostet 3 € → 7 kg kosten 21 €.</div>
<p>Bei indirekter Proportionalität rechnest du über das Produkt.</p>`,
gen:{
einstieg:(i)=>{const k=ri(1,3),n1=ri(2,10),n2=ri(2,12);return F(`${n1} Brötchen kosten ${(n1*k/2).toFixed(2)} €. ${n2} in €:`,(n2*k/2).toFixed(2),`${(n2*k/2).toFixed(2)} €.`,'Schluss auf 1.');},
grundlagen:(i)=>{const k=ri(2,5),n1=ri(2,8),n2=ri(2,12);return F(`${n1} kg kosten ${n1*k} €. ${n2} kg in €:`,n2*k,`${n2*k} €.`,'Einheit.');},
fortgeschritten:(i)=>{const k=ri(2,6),n1=ri(2,6),n2=ri(2,8);return F(`${n1} kg kosten ${(n1*k).toFixed(2)} €. ${n2} kg in €:`,(n2*k).toFixed(2),`${(n2*k).toFixed(2)} €.`,'Dezimal.');},
experten:(i)=>{const b1=ri(3,8),t1=ri(10,20),b2=b1+ri(2,5);return F(`${b1} Bagger brauchen ${t1} Tage. ${b2} Bagger ? Tage`,(b1*t1/b2).toFixed(2),`${(b1*t1/b2).toFixed(2)} Tage.`,'Indirekt.');},
multistep:(i)=>{const k=ri(1,4),n1=ri(4,10),n2=ri(5,15);return MS(`Dreisatz: <b>${n1} Stück</b> kosten <b>${n1*k} €</b>. Wie viel kosten <b>${n2} Stück</b>?`,
[{q:`Preis für 1 Stück in €:`,a:String(k),e:`${n1*k}/${n1} = ${k}`},
{q:`Preis für ${n2} Stück in €:`,a:String(n2*k),e:`${n2*k}`},
{q:`Preis für ${n2*2} Stück in €:`,a:String(n2*2*k),e:`${n2*2*k}`}],
`Klassischer Dreisatz.`,'Einheitswert bestimmen.');}
}},
u4:{name:"Graphische Darstellung",
e:`<h3>Graphische Darstellung</h3>
<p><b>Direkte Proportionalität:</b> Gerade durch den Ursprung (y = k · x).</p>
<p><b>Indirekte Proportionalität:</b> Hyperbel (y = k / x).</p>
<div class="beispiel">Wenn du Punkte einzeichnest und sie auf einer Geraden durch (0|0) liegen, ist es direkt proportional. Liegen sie auf einer Hyperbel, ist es indirekt.</div>`,
gen:{
einstieg:(i)=>{return MC(`Graph direkter Proportionalität?`,'Gerade durch Ursprung',['Parabel','Hyperbel','Kreis'],'y=k·x.');},
grundlagen:(i)=>{return MC(`Graph indirekter Proportionalität?`,'Hyperbel',['Gerade','Parabel','Kreis'],'y=k/x.');},
fortgeschritten:(i)=>{const k=ri(2,9),x=ri(2,10);return F(`Direkt: y=${k}x. y bei x=${x}?`,k*x,`y=${k*x}.`,'Einsetzen.');},
experten:(i)=>{const k=ri(12,60),x=pick([2,3,4,5,6]);return F(`Indirekt: y=${k}/x. y bei x=${x}?`,(k/x).toFixed(2),`y=${(k/x).toFixed(2)}.`,'k/x.');},
multistep:(i)=>{const k=ri(2,5);return MS(`Direkte Proportionalität y = ${k}x.`,
[{q:`y bei x=1?`,a:String(k),e:`${k}`},
{q:`y bei x=4?`,a:String(k*4),e:`${k*4}`},
{q:`y bei x=10?`,a:String(k*10),e:`${k*10}`},
{q:`Für y=100, welches x? (gerundet)`,a:(100/k).toFixed(2),e:`x = 100/${k} = ${(100/k).toFixed(2)}`}],
`Direkte Proportionalität mit mehreren Werten.`,'y = k·x.');}
}},
u5:{name:"Gemischte Anwendungen",
e:`<h3>Gemischte Anwendungen zur Proportionalität</h3>
<p>Zuerst musst du erkennen: Ist der Zusammenhang direkt oder indirekt?</p>
<ul style="margin:8px 0 8px 20px">
<li>Mehr – mehr → direkt</li>
<li>Mehr – weniger → indirekt</li>
</ul>
<div class="beispiel"><b>Geschwindigkeit und Zeit</b> für dieselbe Strecke sind indirekt proportional: Je schneller du fährst, desto weniger Zeit brauchst du.</div>
<p>Schreibe dir auf, welche Größe konstant bleibt (Strecke, Arbeit, Vorrat …).</p>`,
gen:{
einstieg:(i)=>{return MC(`„Mehr Arbeiter – weniger Zeit“ ist …`,'indirekt proportional',['direkt','nicht','zufällig'],'Mehr–weniger = indirekt.');},
grundlagen:(i)=>{const k=ri(2,6),n1=ri(2,8),n2=ri(2,12);return F(`${n1} kg kosten ${n1*k} €. ${n2} kg €?`,n2*k,`${n2*k}.`,'Direkt.');},
fortgeschritten:(i)=>{const v=ri(40,80),h1=ri(2,6),h2=h1+ri(1,4);return F(`Auto: ${v} km/h in ${h1} h. Für ${h2} h gleich schnell? km/h`,(v*h1/h2).toFixed(2),`${(v*h1/h2).toFixed(2)}.`,'Indirekt.');},
experten:(i)=>{const r1=ri(2,5),h1=ri(3,10),r2=r1+ri(1,4);return F(`${r1} Röhren füllen in ${h1} h. ${r2} Röhren ? h`,(r1*h1/r2).toFixed(2),`${(r1*h1/r2).toFixed(2)}.`,'Indirekt.');},
multistep:(i)=>{const v=ri(50,80),h1=ri(2,5);return MS(`Ein Auto fährt <b>${v} km/h</b> und braucht <b>${h1} h</b> für eine Strecke.`,
[{q:`Strecke in km:`,a:String(v*h1),e:`${v}·${h1} = ${v*h1}`},
{q:`Für dieselbe Strecke in ${h1+1} h: nötige Geschwindigkeit (km/h)?`,a:(v*h1/(h1+1)).toFixed(2),e:`${v*h1}/${h1+1} = ${(v*h1/(h1+1)).toFixed(2)}`},
{q:`Für ${h1+2} h (km/h)?`,a:(v*h1/(h1+2)).toFixed(2),e:`${(v*h1/(h1+2)).toFixed(2)}`}],
`Geschwindigkeit und Zeit sind indirekt proportional.`,'Strecke konstant.');}
}}
}}
}},
b4:{name:"Statistik",icon:"📊",kapitel:{
k11:{name:"Statistik",icon:"📉",unter:{
u1:{name:"Daten sammeln und ordnen",
e:`<h3>Daten sammeln und ordnen</h3>
<p>Eine <b>Urliste</b> enthält die Rohdaten in der Reihenfolge, wie sie aufgenommen wurden.</p>
<p>Eine <b>Rangliste</b> ist die sortierte Liste (von klein nach groß oder umgekehrt).</p>
<div class="beispiel"><b>Beispiel:</b> Noten: 3, 1, 4, 2, 3 → Rangliste: 1, 2, 3, 3, 4</div>
<p>Aus der Rangliste kannst du leicht den kleinsten Wert, den größten Wert und den Median ablesen.</p>`,
gen:{
einstieg:(i)=>{return F(`Wie heißt die <b>sortierte</b> Liste?`,'rangliste','Rangliste.','Urliste → Rangliste.');},
grundlagen:(i)=>{const n=ri(5,12);const a=[];for(let k=0;k<n;k++)a.push(ri(1,9));return F(`Wie viele Werte? ${a.join(', ')}`,n,`${n} Werte.`,'Zählen.');},
fortgeschritten:(i)=>{const v=ri(1,6),c=ri(2,5),o=[];for(let k=0;k<c;k++)o.push(v);for(let k=0;k<3;k++)o.push(ri(7,9));const s=shuffle(o);return F(`Wie oft kommt <b>${v}</b> vor? ${s.join(', ')}`,c,`${c}-mal.`,'Häufigkeit.');},
experten:(i)=>{const a=[];for(let k=0;k<8;k++)a.push(ri(1,20));a.sort((x,y)=>x-y);return F(`Median der Liste ${a.join(', ')} (1 Dezimale):`,((a[3]+a[4])/2).toFixed(1),`Mittlere zwei: ${a[3]}, ${a[4]}.`,'Bei gerader Anzahl: Mittel der Mittleren.');},
multistep:(i)=>{const a=[];for(let k=0;k<7;k++)a.push(ri(1,15));return MS(`Datenliste: <b>${a.join(', ')}</b>`,
[{q:`Sortierte Rangliste (Zahlen mit Komma getrennt):`,a:a.slice().sort((x,y)=>x-y).join(','),e:`${a.slice().sort((x,y)=>x-y).join(', ')}`},
{q:`Kleinster Wert:`,a:String(Math.min(...a)),e:`${Math.min(...a)}`},
{q:`Größter Wert:`,a:String(Math.max(...a)),e:`${Math.max(...a)}`},
{q:`Median (4. Wert):`,a:String(a.slice().sort((x,y)=>x-y)[3]),e:`${a.slice().sort((x,y)=>x-y)[3]}`}],
`Daten ordnen und Median.`,'Erst sortieren.');}
}},
u2:{name:"Häufigkeitstabellen",
e:`<h3>Häufigkeitstabellen</h3>
<p><b>Absolute Häufigkeit:</b> Wie oft kommt ein Wert vor? (einfach zählen)</p>
<p><b>Relative Häufigkeit:</b> Welchen Anteil macht der Wert aus? (absolute Häufigkeit ÷ Gesamtanzahl)</p>
<p>Die relative Häufigkeit kannst du als Bruch, Dezimalzahl oder Prozent angeben.</p>
<div class="beispiel"><b>Beispiel:</b> In 20 Würfen kommt die 6 fünfmal vor.<br>
Absolute Häufigkeit: 5<br>
Relative Häufigkeit: 5/20 = 0,25 = 25 %</div>`,
gen:{
einstieg:(i)=>{const h=ri(1,8);return F(`Absolute Häufigkeit = ${h}. Wie viel?`,h,`${h}.`,'Anzahl.');},
grundlagen:(i)=>{const t=ri(10,40),h=ri(1,t);return F(`${h} von ${t} → rel. Häufigkeit in % (gerundet):`,Math.round(h/t*100),`${(h/t*100).toFixed(1)} %.`,'Anteil.');},
fortgeschritten:(i)=>{const t=ri(20,50),h=ri(1,t-1);return F(`${h} von ${t} → rel. % (1 Dezimale):`,(h/t*100).toFixed(1),`${(h/t*100).toFixed(1)}.`,'Prozent.');},
experten:(i)=>{const t=ri(20,60),p=ri(10,60);return F(`rel. Häufigkeit ${p}%, Gesamt ${t}. Absolute Häufigkeit (gerundet):`,Math.round(t*p/100),`${t}·${p}/100 = ${Math.round(t*p/100)}.`,'abs = rel·G.');},
multistep:(i)=>{const t=ri(20,50),h=ri(3,t-3);return MS(`Ein Wert kommt <b>${h}</b> mal in einer Stichprobe von <b>${t}</b> Werten vor.`,
[{q:`Absolute Häufigkeit:`,a:String(h),e:`${h}`},
{q:`Relative Häufigkeit als Bruch gekürzt (a/b):`,a:simp(h,t),e:`${h}/${t} = ${simp(h,t)}`},
{q:`Als Dezimalwert (3 Dezimalen):`,a:(h/t).toFixed(3).replace('.',','),e:`${(h/t).toFixed(3)}`},
{q:`In Prozent (1 Dezimale):`,a:(h/t*100).toFixed(1).replace('.',','),e:`${(h/t*100).toFixed(1)} %`}],
`Häufigkeiten umrechnen.`,'abs → rel → %.');}
}},
u3:{name:"Diagramme",
e:`<h3>Diagramme</h3>
<p>Diagramme helfen, Daten anschaulich darzustellen.</p>
<ul style="margin:8px 0 8px 20px">
<li><b>Säulen- und Balkendiagramm:</b> gut für Vergleiche</li>
<li><b>Kreisdiagramm:</b> gut für Anteile. Der Winkel = relative Häufigkeit · 360°</li>
<li><b>Liniendiagramm:</b> gut für Entwicklungen über die Zeit</li>
</ul>
<div class="beispiel">25 % im Kreisdiagramm entsprechen 90° (weil 0,25 · 360 = 90).</div>`,
gen:{
einstieg:(i)=>{return MC(`Welches Diagramm nutzt Winkel?`,'Kreisdiagramm',['Säulen','Balken','Linien'],'Kreis = 360°.');},
grundlagen:(i)=>{const p=pick([10,20,25,40,50,60,75]);return F(`${p}% → Winkel in °:`,p*3.6,`${p*3.6}°.`,'rel·360.');},
fortgeschritten:(i)=>{const p=pick([5,15,30,45,55,65,80,90]);return F(`${p}% → Winkel:`,p*3.6,`${p*3.6}°.`,'Formel.');},
experten:(i)=>{const w=pick([36,72,108,144,180,216,252,288]);return F(`${w}° im Kreis → % (gerundet):`,Math.round(w/360*100),`${Math.round(w/360*100)}%.`,'Winkel/360.');},
multistep:(i)=>{const p=pick([15,20,25,30,40]);return MS(`Ein Anteil ist <b>${p}%</b>.`,
[{q:`Als Bruch (gekürzt):`,a:simp(p,100),e:`${simp(p,100)}`},
{q:`Als Dezimalzahl:`,a:(p/100).toString().replace('.',','),e:`${p/100}`},
{q:`Winkel im Kreisdiagramm in Grad:`,a:String(p*3.6),e:`${p*3.6}°`},
{q:`Anteil von ${p*10} Personen absolut:`,a:String(p*10*p/100),e:`${p*10}·${p}/100 = ${p*10*p/100}`}],
`Prozent ↔ Kreisdiagramm.`,'Winkel = rel·360°.');}
}},
u4:{name:"Arithmetisches Mittel",
e:`<h3>Arithmetisches Mittel</h3>
<p>Das <b>arithmetische Mittel</b> (Durchschnitt) berechnest du so:</p>
<p>Summe aller Werte ÷ Anzahl der Werte</p>
<div class="beispiel"><b>Beispiel:</b> Noten 2, 3, 1, 4, 5<br>
Summe = 15, Anzahl = 5 → Mittel = 3</div>
<p>Das Mittel wird stark von Ausreißern (sehr hohen oder sehr niedrigen Werten) beeinflusst.</p>`,
gen:{
einstieg:(i)=>{const a=ri(1,20),b=ri(1,20);return F(`Mittelwert von ${a} und ${b}:`,((a+b)/2).toFixed(2),`${((a+b)/2).toFixed(2)}.`,'Summe/2.');},
grundlagen:(i)=>{const a=ri(1,10),b=ri(1,10),c=ri(1,10);return F(`Mittel von ${a},${b},${c}:`,((a+b+c)/3).toFixed(2),`${((a+b+c)/3).toFixed(2)}.`,'Summe/3.');},
fortgeschritten:(i)=>{const arr=[];for(let k=0;k<5;k++)arr.push(ri(1,20));const s=arr.reduce((a,b)=>a+b,0);return F(`Mittel von ${arr.join(', ')}:`,(s/5).toFixed(2),`${(s/5).toFixed(2)}.`,'Summe/5.');},
experten:(i)=>{const n=ri(3,6),m=ri(5,20);const arr=[];let s=0;for(let k=0;k<n-1;k++){const v=ri(1,30);arr.push(v);s+=v;}return F(`${n} Werte mit Mittel ${m}. ${n-1} Werte: ${arr.join(', ')}. Fehlender Wert?`,n*m-s,`Summe=${n*m}. ${n*m}−${s}=${n*m-s}.`,'Rückwärts.');},
multistep:(i)=>{const arr=[];for(let k=0;k<5;k++)arr.push(ri(1,20));const s=arr.reduce((a,b)=>a+b,0);return MS(`Datenliste: <b>${arr.join(', ')}</b>`,
[{q:`Summe der Werte:`,a:String(s),e:`${arr.join('+')} = ${s}`},
{q:`Anzahl der Werte:`,a:'5',e:'5'},
{q:`Mittelwert (2 Dezimalen):`,a:(s/5).toFixed(2),e:`${s}/5 = ${(s/5).toFixed(2)}`},
{q:`Wenn ein Wert 0 hinzugefügt wird – neuer Mittelwert (2 Dezimalen)?`,a:(s/6).toFixed(2),e:`${s}/6 = ${(s/6).toFixed(2)}`}],
`Mittelwert mit Variation.`,'Summe/Anzahl.');}
}},
u5:{name:"Median",
e:`<h3>Median</h3>
<p>Der <b>Median</b> ist der mittlere Wert in der sortierten Liste.</p>
<ul style="margin:8px 0 8px 20px">
<li>Bei ungerader Anzahl: der Wert in der Mitte</li>
<li>Bei gerader Anzahl: der Mittelwert der beiden mittleren Werte</li>
</ul>
<div class="beispiel"><b>Beispiel:</b> 1, 3, 5, 7, 100 → Median = 5 (der Ausreißer 100 stört den Median nicht)</div>
<p>Der Median ist robuster gegen Ausreißer als das arithmetische Mittel.</p>`,
gen:{
einstieg:(i)=>{const a=[];for(let k=0;k<5;k++)a.push(ri(1,20));a.sort((x,y)=>x-y);return F(`Median von ${a.join(', ')}:`,a[2],`Mittlerer = ${a[2]}.`,'Sortiert ist mittlerer Wert 3.');},
grundlagen:(i)=>{const a=[];for(let k=0;k<4;k++)a.push(ri(1,20));a.sort((x,y)=>x-y);return F(`Median von ${a.join(', ')} (1 Dezimale):`,((a[1]+a[2])/2).toFixed(1),`Mittel von ${a[1]} und ${a[2]}.`,'Mittel der Mittleren.');},
fortgeschritten:(i)=>{const a=[];for(let k=0;k<5;k++)a.push(ri(1,30));const s=shuffle(a);const so=a.slice().sort((x,y)=>x-y);return F(`Median von ${s.join(', ')} (unsortiert):`,so[2],`Sortiert: ${so.join(', ')} → ${so[2]}.`,'Erst sortieren.');},
experten:(i)=>{const a=[ri(1,10),ri(1,10),ri(1,10),ri(1,10),ri(50,100)].sort((x,y)=>x-y);return F(`Median mit Ausreißer: ${a.join(', ')}`,a[2],`Median = ${a[2]} (robust).`,'Median ignoriert Ausreißer.');},
multistep:(i)=>{const a=[];for(let k=0;k<6;k++)a.push(ri(1,25));const s=a.slice().sort((x,y)=>x-y);return MS(`Datenliste (unsortiert): <b>${shuffle(a).join(', ')}</b>`,
[{q:`Sortierte Rangliste (Zahlen mit Komma getrennt):`,a:s.join(','),e:`${s.join(', ')}`},
{q:`3. Wert der Rangliste:`,a:String(s[2]),e:`${s[2]}`},
{q:`4. Wert der Rangliste:`,a:String(s[3]),e:`${s[3]}`},
{q:`Median (Mittel der beiden Mittleren, 1 Dezimale):`,a:((s[2]+s[3])/2).toFixed(1),e:`(${s[2]}+${s[3]})/2 = ${((s[2]+s[3])/2).toFixed(1)}`}],
`Median bei gerader Anzahl.`,'Sortieren, dann Mittel der Mittleren.');}
}},
u6:{name:"Kennwerte interpretieren",
e:`<h3>Kennwerte interpretieren</h3>
<p>Mittelwert und Median beschreiben die „Mitte“ einer Datenreihe, reagieren aber unterschiedlich auf Ausreißer.</p>
<ul style="margin:8px 0 8px 20px">
<li><b>Mittelwert:</b> empfindlich gegenüber sehr hohen oder niedrigen Werten</li>
<li><b>Median:</b> robuster, wird von Ausreißern weniger beeinflusst</li>
</ul>
<div class="beispiel">Bei Gehältern oder Hauspreisen ist der Median oft aussagekräftiger als der Mittelwert, weil ein paar sehr reiche Personen den Durchschnitt stark nach oben ziehen.</div>`,
gen:{
einstieg:(i)=>{return MC(`Welcher Kennwert ist robuster?`,'Median',['Mittel','Summe','Maximum'],'Median wird weniger verzerrt.');},
grundlagen:(i)=>{const a=[ri(1,5),ri(2,5),ri(3,6),ri(4,7),100];const s=a.reduce((x,y)=>x+y,0);return F(`Mittel von ${a.join(', ')} (1 Dezimale):`,(s/5).toFixed(1),`${(s/5).toFixed(1)}.`,'Summe/5.');},
fortgeschritten:(i)=>{const a=[ri(1,5),ri(2,6),ri(3,7),ri(4,8),100].sort((x,y)=>x-y);return F(`Median von ${a.join(', ')}:`,a[2],`${a[2]}.`,'Mittlerer.');},
experten:(i)=>{const base=[ri(5,10),ri(5,10),ri(5,10),ri(5,10),100];const s=base.reduce((x,y)=>x+y,0);const so=base.slice().sort((x,y)=>x-y);return F(`Mittel − Median bei ${base.join(', ')} (2 Dezimalen):`,(s/5-so[2]).toFixed(2),`${(s/5-so[2]).toFixed(2)}.`,'Ausreißer → große Differenz.');},
multistep:(i)=>{const base=[ri(5,10),ri(5,10),ri(5,10),ri(5,10),100];const s=base.reduce((x,y)=>x+y,0);const so=base.slice().sort((x,y)=>x-y);return MS(`Werte: <b>${base.join(', ')}</b>`,
[{q:`Summe:`,a:String(s),e:`${s}`},
{q:`Mittelwert (2 Dezimalen):`,a:(s/5).toFixed(2),e:`${(s/5).toFixed(2)}`},
{q:`Median:`,a:String(so[2]),e:`${so[2]}`},
{q:`Differenz Mittel − Median (2 Dezimalen):`,a:(s/5-so[2]).toFixed(2),e:`${(s/5-so[2]).toFixed(2)}`}],
`Mittelwert vs Median bei Ausreißer.`,'Median robuster.');}
}}
}}
}}
};

/* ============ STATE ============ */
const KEY='mathe2_v3';
let S=load();
function defaults(){return{xp:0,level:1,streak:0,totalCorrect:0,totalAnswered:0,prog:{},cur:{}};}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||defaults();}catch(e){return defaults();}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ============ RENDER HOME ============ */
const main=document.getElementById('main');

function renderHome(){
  let h='<h2 class="section-title">Wähle einen Bereich</h2><p class="section-sub">Insgesamt 11 Kapitel · 52 Unterkapitel · 6.240+ Aufgaben</p><div class="grid grid-2">';
  for(const [bid,b] of Object.entries(C)){
    const st=getBereichStat(bid);
    h+=`<div class="card ${st.done===st.total&&st.total>0?'done':''}" onclick="openBereich('${bid}')">
    <div class="badge">${st.done}/${st.total}</div>
    <h3>${b.icon} ${b.name}</h3><div class="sub">${Object.keys(b.kapitel).length} Kapitel</div></div>`;
  }
  h+='</div>';
  main.innerHTML=h;updateStats();updateProgressMini();
}

function renderBereich(bid){
  const b=C[bid];
  let h=`<div class="breadcrumb" onclick="renderHome()"><span>🏠 Start</span> › ${b.name}</div>`;
  h+=`<h2 class="section-title">${b.icon} ${b.name}</h2><div class="grid">`;
  for(const [kid,k] of Object.entries(b.kapitel)){
    const st=getKapitelStat(bid,kid);
    h+=`<div class="card ${st.done===st.total&&st.total>0?'done':''}" onclick="openKapitel('${bid}','${kid}')">
    <div class="badge">${st.done}/${st.total}</div>
    <h3>${k.icon} ${k.name}</h3><div class="sub">${Object.keys(k.unter).length} Unterkapitel</div></div>`;
  }
  h+='</div>';main.innerHTML=h;updateStats();updateProgressMini();
}

function renderKapitel(bid,kid){
  const b=C[bid],k=b.kapitel[kid];
  let h=`<div class="breadcrumb"><span onclick="renderHome()">🏠 Start</span> › <span onclick="openBereich('${bid}')">${b.name}</span> › ${k.name}</div>`;
  h+=`<h2 class="section-title">${k.icon} ${k.name}</h2><div class="grid">`;
  for(const [uid,u] of Object.entries(k.unter)){
    const st=getUnterStat(bid,kid,uid);
    h+=`<div class="card ${st.done===st.total&&st.total>0?'done':''}" onclick="openUnter('${bid}','${kid}','${uid}')">
    <div class="badge">${st.done}/${st.total}</div>
    <h3>${u.name}</h3><div class="sub">120 Aufg. + 8 Multi-Step</div></div>`;
  }
  h+=`<div class="card" style="border-color:#a855f7;background:linear-gradient(135deg,#faf5ff,#f3e8ff)" onclick="startGame('${bid}','${kid}')">
    <div class="badge" style="background:#a855f7;color:#fff">Spiel</div>
    <h3>🎮 Lernspiel</h3><div class="sub">Schnelles Quiz mit Extra-XP!</div></div>`;
  h+='</div>';main.innerHTML=h;updateStats();updateProgressMini();
}

function renderUnter(bid,kid,uid){
  const b=C[bid],k=b.kapitel[kid],u=k.unter[uid];
  let h=`<div class="breadcrumb"><span onclick="renderHome()">🏠 Start</span> › <span onclick="openBereich('${bid}')">${b.name}</span> › <span onclick="openKapitel('${bid}','${kid}')">${k.name}</span> › ${u.name}</div>`;
  h+=`<h2 class="section-title">${u.name}</h2><p class="section-sub">Wähle Stufe – jede Stufe hat 30 Aufgaben</p>`;
  h+=`<div class="erklaerung-box">${u.e}</div><div class="level-grid">`;
  const lv=[
    {k:'einstieg',n:'Einstieg',d:'Erste Übungen – einfach'},
    {k:'grundlagen',n:'Grundlagen',d:'Standardaufgaben'},
    {k:'fortgeschritten',n:'Fortgeschritten',d:'Mehrere Schritte'},
    {k:'experten',n:'Experten',d:'Knifflig – Transfer'}
  ];
  for(const l of lv){
    const st=S.prog[`${bid}.${kid}.${uid}.${l.k}`]||{done:0};
    const done=st.done>=30;
    h+=`<button class="level-btn ${l.k}" onclick="openLevel('${bid}','${kid}','${uid}','${l.k}')">
    <span class="lv">${done?'✅ ':''}${l.n} <small style="color:#6c757d;font-weight:400">(30 Aufg.)</small></span>
    <span class="lvd">${l.d}</span></button>`;
  }
  const stMS=S.prog[`${bid}.${kid}.${uid}.multistep`]||{done:0};
  h+=`<button class="level-btn multistep" onclick="openLevel('${bid}','${kid}','${uid}','multistep')">
  <span class="lv">${stMS.done>=8?'✅ ':''}🎯 Multi-Step-Aufgaben <small style="color:#7c3aed;font-weight:400">(8 Aufg. mit 3-5 Schritten)</small></span>
  <span class="lvd">Mehrstufige Aufgaben – jeder Schritt einzeln geprüft</span></button>`;
  h+=`</div><div class="btn-row"><button class="btn btn-secondary" onclick="openKapitel('${bid}','${kid}')">← Zurück</button></div>`;
  main.innerHTML=h;updateStats();updateProgressMini();
}

function lvLabel(l){return{einstieg:'Einstieg',grundlagen:'Grundlagen',fortgeschritten:'Fortgeschritten',experten:'Experten',multistep:'Multi-Step'}[l];}
function typeLabel(t){return{mc:'Multiple Choice',fill:'Lückentext',multi:'Multi-Step'}[t];}

function renderQuestion(bid,kid,uid,lvk,idx,stepIdx,keepResults){
  const u=C[bid].kapitel[kid].unter[uid];
  const tasks=getTasks(bid,kid,uid,lvk);
  const q=tasks[idx];
  if(!q){openUnter(bid,kid,uid);return;}
  const prev = (keepResults && S.cur && S.cur.bereich===bid && S.cur.kapitel===kid && S.cur.unter===uid && S.cur.level===lvk && S.cur.index===idx) ? (S.cur.stepResults||[]) : [];
  S.cur={bereich:bid,kapitel:kid,unter:uid,level:lvk,index:idx,answered:false,matched:[],sel:null,stepIdx:stepIdx||0,stepResults:prev};
  save();
  const b=C[bid],k=b.kapitel[kid];
  let h=`<div class="breadcrumb"><span onclick="renderHome()">🏠</span> › <span onclick="openBereich('${bid}')">${b.name}</span> › <span onclick="openKapitel('${bid}','${kid}')">${k.name}</span> › <span onclick="openUnter('${bid}','${kid}','${uid}')">${u.name}</span> › ${lvLabel(lvk)}</div>`;
  h+=`<div class="q-card">`;
  h+=`<span class="q-type t-${q.t}">${typeLabel(q.t)}</span>`;
  h+=`<span class="q-level">Aufgabe ${idx+1}/${tasks.length} · ${lvLabel(lvk)}</span>`;
  h+=`<div style="clear:both"></div>`;
  
  if(q.t==='multi'){
    const si=stepIdx||0;
    const total=q.steps.length;
    h+=`<div class="step-counter">Schritt ${si+1} von ${total}</div>`;
    h+=`<div class="step-bar">`;
    for(let k2=0;k2<total;k2++){
      const cls=k2<si?'done':k2===si?'active':'';
      h+=`<div class="step-dot ${cls}"></div>`;
    }
    h+=`</div>`;
    if(S.cur.stepResults && S.cur.stepResults.length>0){
      h+=`<div class="prev-steps">`;
      S.cur.stepResults.forEach((r,i)=>{
        h+=`<div class="prev-step">✓ Schritt ${i+1}: <b>${r.a}</b></div>`;
      });
      h+=`</div>`;
    }
    h+=`<div class="q-text">${q.f}</div>`;
    h+=`<div class="q-text" style="color:#7c3aed">${q.steps[si].q}</div>`;
    h+=`<div class="hint-row"><button class="btn btn-secondary" style="padding:8px 14px;font-size:.85em" onclick="showHint()">💡 Hinweis (-3 XP)</button></div><div class="hint-box" id="hintBox"></div>`;
    h+=`<div class="fill-row"><input type="text" id="fillIn" placeholder="Antwort..." autocomplete="off"><button class="btn btn-primary" onclick="checkMulti()">Prüfen</button></div>`;
  } else {
    h+=`<div class="q-text">${q.f}</div>`;
    if(q.t==='mc'){
      h+=`<div class="options" id="opts">`;
      q.o.forEach((o,i)=>{h+=`<button class="opt" data-i="${i}" onclick="checkMC(${i},${q.r})">${o}</button>`;});
      h+=`</div>`;
    } else if(q.t==='fill'){
      h+=`<div class="hint-row"><button class="btn btn-secondary" style="padding:8px 14px;font-size:.85em" onclick="showHint()">💡 Hinweis (-3 XP)</button></div><div class="hint-box" id="hintBox"></div>`;
      h+=`<div class="fill-row"><input type="text" id="fillIn" placeholder="Antwort..." autocomplete="off"><button class="btn btn-primary" onclick="checkFill()">Prüfen</button></div>`;
    }
  }
  h+=`<div class="feedback" id="fb"></div><div class="btn-row" id="btns">`;
  h+=`<button class="btn btn-secondary" onclick="openUnter('${bid}','${kid}','${uid}')">← Abbrechen</button>`;
  h+=`</div></div>`;
  main.innerHTML=h;
  if(q.t!=='mc'){
    const inp=document.getElementById('fillIn');
    if(inp){
      inp.focus();
      inp.addEventListener('keydown',e=>{
        if(e.key==='Enter'){
          if(q.t==='multi')checkMulti();else checkFill();
        }
      });
    }
  }
  updateStats();
}

/* ============ ACTIONS ============ */
function openBereich(b){renderBereich(b);}
function openKapitel(b,k){renderKapitel(b,k);}
function openUnter(b,k,u){renderUnter(b,k,u);}
function openLevel(b,k,u,lv){renderQuestion(b,k,u,lv,0,0);}

function checkMC(i,correct){
  if(S.cur.answered)return;S.cur.answered=true;
  const opts=document.querySelectorAll('.opt');
  opts.forEach((o,j)=>{
    o.classList.add('dis');
    if(j===correct)o.classList.add('correct');
    if(j===i&&i!==correct)o.classList.add('wrong');
  });
  const q=getTasks(S.cur.bereich,S.cur.kapitel,S.cur.unter,S.cur.level)[S.cur.index];
  handleResult(i===correct,q.e,q.regel||'');
}

function checkFill(){
  if(S.cur.answered)return;
  const inp=document.getElementById('fillIn');
  const val=inp.value||'';
  if(!val.trim())return;
  S.cur.answered=true;
  const q=getTasks(S.cur.bereich,S.cur.kapitel,S.cur.unter,S.cur.level)[S.cur.index];
  const ok=answersMatch(val, q.a, q.alt);
  inp.classList.add(ok?'correct':'wrong');
  inp.disabled=true;
  handleResult(ok,q.e,q.regel||'');
}

function checkMulti(){
  if(S.cur.answered)return;
  const inp=document.getElementById('fillIn');
  const val=inp.value||'';
  if(!val.trim())return;
  const q=getTasks(S.cur.bereich,S.cur.kapitel,S.cur.unter,S.cur.level)[S.cur.index];
  const step=q.steps[S.cur.stepIdx];
  const ok=answersMatch(val, step.a, step.alt);
  
  S.cur.answered=true;
  inp.classList.add(ok?'correct':'wrong');
  inp.disabled=true;
  
  const fb=document.getElementById('fb');
  const btns=document.getElementById('btns');
  
  if(ok){
    S.cur.stepResults.push({a:step.a});
    addXP(5);
    fb.className='feedback correct show';
    fb.innerHTML=`<strong>✅ Schritt ${S.cur.stepIdx+1} richtig! (+5 XP)</strong>${step.e}${step.regel?`<div class="regel">${step.regel}</div>`:''}`;
    const isLast=S.cur.stepIdx>=q.steps.length-1;
    btns.innerHTML='';
    const bBtn=document.createElement('button');
    bBtn.className='btn btn-secondary';
    bBtn.textContent='← Abbrechen';
    bBtn.onclick=()=>openUnter(S.cur.bereich,S.cur.kapitel,S.cur.unter);
    btns.appendChild(bBtn);
    if(isLast){
      S.streak++;S.totalCorrect++;S.totalAnswered++;
      addXP(10);
      const pk=`${S.cur.bereich}.${S.cur.kapitel}.${S.cur.unter}.multistep`;
      if(!S.prog[pk])S.prog[pk]={done:0};
      S.prog[pk].done=Math.max(S.prog[pk].done,S.cur.index+1);
      save();
      let sumHtml=`<div class="summary"><h3>🎉 Alle Schritte geschafft!</h3>`;
      q.steps.forEach((st,i)=>{sumHtml+=`<div class="sum-step">Schritt ${i+1}: <b>${S.cur.stepResults[i].a}</b></div>`;});
      sumHtml+=`<div style="margin-top:10px">${q.e||''}</div></div>`;
      fb.innerHTML+=sumHtml;
      const nBtn=document.createElement('button');
      nBtn.className='btn btn-primary';
      nBtn.textContent=S.cur.index<getTasks(S.cur.bereich,S.cur.kapitel,S.cur.unter,'multistep').length-1?'Nächste Multi-Step →':'🎉 Zur Übersicht';
      nBtn.onclick=()=>{
        if(S.cur.index<getTasks(S.cur.bereich,S.cur.kapitel,S.cur.unter,'multistep').length-1)renderQuestion(S.cur.bereich,S.cur.kapitel,S.cur.unter,'multistep',S.cur.index+1,0);
        else openUnter(S.cur.bereich,S.cur.kapitel,S.cur.unter);
      };
      btns.appendChild(nBtn);
    } else {
      const nBtn=document.createElement('button');
      nBtn.className='btn btn-primary';
      nBtn.textContent='Weiter zu Schritt '+(S.cur.stepIdx+2)+' →';
      nBtn.onclick=()=>{
        renderQuestion(S.cur.bereich,S.cur.kapitel,S.cur.unter,'multistep',S.cur.index,S.cur.stepIdx+1, true);
      };
      btns.appendChild(nBtn);
    }
  } else {
    S.streak=0;S.totalAnswered++;
    fb.className='feedback wrong show';
    fb.innerHTML=`<strong>❌ Leider falsch. Versuch es nochmal!</strong>Richtige Antwort: <b>${step.a}</b><br>${step.e}`;
    // Retry button
    const rBtn=document.createElement('button');
    rBtn.className='btn btn-primary';
    rBtn.textContent='Nochmal versuchen';
    rBtn.onclick=()=>{renderQuestion(S.cur.bereich,S.cur.kapitel,S.cur.unter,'multistep',S.cur.index,S.cur.stepIdx, true);};
    btns.innerHTML='';
    btns.appendChild(rBtn);
    const bBtn=document.createElement('button');
    bBtn.className='btn btn-secondary';
    bBtn.textContent='← Abbrechen';
    bBtn.onclick=()=>openUnter(S.cur.bereich,S.cur.kapitel,S.cur.unter);
    btns.appendChild(bBtn);
    updateStats();
    return;
  }
  updateStats();updateProgressMini();
}

function handleResult(ok,expl,regel){
  const u=C[S.cur.bereich].kapitel[S.cur.kapitel].unter[S.cur.unter];
  const q=getTasks(S.cur.bereich,S.cur.kapitel,S.cur.unter,S.cur.level)[S.cur.index];
  const fb=document.getElementById('fb');
  const btns=document.getElementById('btns');
  if(ok){
    S.streak++;S.totalCorrect++;S.totalAnswered++;
    let gain=10+(S.streak>=3?15:0);
    addXP(gain);
    fb.className='feedback correct show';
    fb.innerHTML=`<strong>✅ Richtig! ${S.streak>=3?'🔥 Streak +15 XP':''}</strong>${expl}${regel?`<div class="regel"><b>📘 Merksatz:</b> ${regel}</div>`:''}`;
  } else {
    S.streak=0;S.totalAnswered++;
    fb.className='feedback wrong show';
    const correctAns = q.t==='fill' ? (q.a||'') : '';
    fb.innerHTML=`<strong>❌ Leider falsch.</strong>${correctAns?`Richtige Antwort: <b>${correctAns}</b><br>`:''}${expl}${regel?`<div class="regel"><b>📘 Merksatz:</b> ${regel}</div>`:''}`;
  }
  const pk=`${S.cur.bereich}.${S.cur.kapitel}.${S.cur.unter}.${S.cur.level}`;
  if(!S.prog[pk])S.prog[pk]={done:0};
  S.prog[pk].done=Math.max(S.prog[pk].done,S.cur.index+(ok?1:0));
  save();updateStats();updateProgressMini();
  btns.innerHTML='';
  const bBtn=document.createElement('button');
  bBtn.className='btn btn-secondary';
  bBtn.textContent='← Zurück';
  bBtn.onclick=()=>openUnter(S.cur.bereich,S.cur.kapitel,S.cur.unter);
  btns.appendChild(bBtn);
  const isLast=S.cur.index>=getTasks(S.cur.bereich,S.cur.kapitel,S.cur.unter,S.cur.level).length-1;
  if(!isLast){
    const nBtn=document.createElement('button');
    nBtn.className='btn btn-primary';
    nBtn.textContent='Weiter →';
    nBtn.onclick=()=>renderQuestion(S.cur.bereich,S.cur.kapitel,S.cur.unter,S.cur.level,S.cur.index+1);
    btns.appendChild(nBtn);
  } else {
    const nBtn=document.createElement('button');
    nBtn.className='btn btn-primary';
    nBtn.textContent='🎉 Alle 30 geschafft! Zur Übersicht';
    nBtn.onclick=()=>openUnter(S.cur.bereich,S.cur.kapitel,S.cur.unter);
    btns.appendChild(nBtn);
  }
}

function addXP(n){
  const old=S.level;
  S.xp+=n;S.level=Math.floor(S.xp/100)+1;
  const fl=document.getElementById('xpFloat');
  fl.textContent='+'+n+' XP';
  fl.style.display='block';
  clearTimeout(fl._t);
  fl._t=setTimeout(()=>fl.style.display='none',1400);
  if(S.level>old){
    document.getElementById('lvlTitle').textContent='Level '+S.level+'!';
    document.getElementById('lvlOverlay').classList.add('show');
  }
  save();
}
function closeLvl(){document.getElementById('lvlOverlay').classList.remove('show');}

function updateStats(){
  document.getElementById('sXp').textContent=S.xp;
  document.getElementById('sLevel').textContent=S.level;
  document.getElementById('sStreak').textContent=S.streak;
  document.getElementById('sCorrect').textContent=S.totalCorrect;
}

function getUnterStat(b,k,u){
  let done=0,total=0;
  ['einstieg','grundlagen','fortgeschritten','experten'].forEach(lv=>{
    total+=30;
    const st=S.prog[`${b}.${k}.${u}.${lv}`];
    if(st)done+=Math.min(st.done,30);
  });
  total+=8;
  const stMS=S.prog[`${b}.${k}.${u}.multistep`];
  if(stMS)done+=Math.min(stMS.done,8);
  return{done,total};
}
function getKapitelStat(b,k){
  let done=0,total=0;
  for(const uid of Object.keys(C[b].kapitel[k].unter)){
    const s=getUnterStat(b,k,uid);done+=s.done;total+=s.total;
  }
  return{done,total};
}
function getBereichStat(b){
  let done=0,total=0;
  for(const kid of Object.keys(C[b].kapitel)){
    const s=getKapitelStat(b,kid);done+=s.done;total+=s.total;
  }
  return{done,total};
}
function updateProgressMini(){
  let done=0,total=0;
  for(const b of Object.keys(C)){
    const s=getBereichStat(b);done+=s.done;total+=s.total;
  }
  const pct=total?(done/total)*100:0;
  document.getElementById('progressMini').style.width=pct+'%';
}

  if(confirm('Wirklich gesamten Fortschritt löschen?')){

/* ============ LERNSPIEL ============ */
let gameState = null;

function startGame(bid, kid){
  const b = C[bid];
  const k = b.kapitel[kid];
  const unters = Object.keys(k.unter);
  // Sammle 12 Fragen aus verschiedenen Unterkapiteln (Einstieg/Grundlagen)
  const questions = [];
  for(let i=0; i<12; i++){
    const uid = unters[i % unters.length];
    const u = k.unter[uid];
    srand(hash(bid+kid+uid+'game'+i));
    try{
      const q = u.gen.einstieg ? u.gen.einstieg(i) : u.gen.grundlagen(i);
      if(q && q.t !== 'multi') questions.push({...q, uid});
    }catch(e){}
  }
  if(questions.length < 5){
    alert('Nicht genug Fragen für das Spiel verfügbar.');
    return;
  }
  gameState = {
    bid, kid,
    questions: questions.slice(0,10),
    index: 0,
    score: 0,
    correct: 0,
    timeLeft: 90,
    timer: null,
    answered: false
  };
  renderGameQuestion();
  gameState.timer = setInterval(()=>{
    gameState.timeLeft--;
    const el = document.getElementById('gameTimer');
    if(el) el.textContent = gameState.timeLeft + 's';
    if(gameState.timeLeft <= 0) endGame();
  }, 1000);
}

function renderGameQuestion(){
  if(!gameState) return;
  const q = gameState.questions[gameState.index];
  const total = gameState.questions.length;
  let h = `<div class="breadcrumb" onclick="endGame(true)"><span>🏠 Zurück</span> › Lernspiel</div>`;
  h += `<div class="q-card">`;
  h += `<div class="game-timer" id="gameTimer">${gameState.timeLeft}s</div>`;
  h += `<div class="game-score">Punkte: ${gameState.score} · Frage ${gameState.index+1}/${total}</div>`;
  h += `<span class="q-type t-${q.t}">${typeLabel(q.t)}</span>`;
  h += `<div class="q-text">${q.f}</div>`;
  if(q.t === 'mc'){
    h += `<div class="options" id="opts">`;
    q.o.forEach((o,i)=>{
      h += `<button class="opt" onclick="answerGameMC(${i},${q.r})">${o}</button>`;
    });
    h += `</div>`;
  } else if(q.t === 'fill'){
    h += `<div class="fill-row"><input type="text" id="gameFill" placeholder="Antwort..." autocomplete="off"><button class="btn btn-primary" onclick="answerGameFill()">OK</button></div>`;
  }
  h += `<div class="feedback" id="fb"></div>`;
  h += `</div>`;
  main.innerHTML = h;
  const inp = document.getElementById('gameFill');
  if(inp){
    inp.focus();
    inp.addEventListener('keydown', e => { if(e.key==='Enter') answerGameFill(); });
  }
}

function answerGameMC(i, correct){
  if(gameState.answered) return;
  gameState.answered = true;
  const ok = i === correct;
  const opts = document.querySelectorAll('.opt');
  opts.forEach((o,j)=>{
    o.classList.add('dis');
    if(j===correct) o.classList.add('correct');
    if(j===i && !ok) o.classList.add('wrong');
  });
  processGameAnswer(ok);
}

function answerGameFill(){
  if(gameState.answered) return;
  const inp = document.getElementById('gameFill');
  const val = inp.value || '';
  if(!val.trim()) return;
  gameState.answered = true;
  const q = gameState.questions[gameState.index];
  const ok = answersMatch(val, q.a, q.alt);
  inp.classList.add(ok?'correct':'wrong');
  inp.disabled = true;
  processGameAnswer(ok);
}

function processGameAnswer(ok){
  const fb = document.getElementById('fb');
  if(ok){
    gameState.correct++;
    const points = Math.max(5, Math.floor(gameState.timeLeft / 3));
    gameState.score += points;
    addXP(points);
    fb.className = 'feedback correct show';
    fb.innerHTML = `<strong>✅ Richtig! +${points} Punkte</strong>`;
  } else {
    fb.className = 'feedback wrong show';
    const q = gameState.questions[gameState.index];
    const ans = q.t==='mc' ? q.o[q.r] : q.a;
    fb.innerHTML = `<strong>❌ Leider falsch.</strong> Richtig: <b>${ans}</b>`;
  }
  setTimeout(()=>{
    gameState.index++;
    gameState.answered = false;
    if(gameState.index >= gameState.questions.length) endGame();
    else renderGameQuestion();
  }, 900);
}

function endGame(aborted){
  if(gameState && gameState.timer) clearInterval(gameState.timer);
  if(aborted){
    openKapitel(gameState.bid, gameState.kid);
    gameState = null;
    return;
  }
  const gs = gameState;
  gameState = null;
  let h = `<div class="game-end">`;
  h += `<h2>🎉 Spiel beendet!</h2>`;
  h += `<p style="font-size:1.2em;margin:15px 0">Du hast <b>${gs.correct}</b> von <b>${gs.questions.length}</b> richtig.</p>`;
  h += `<p style="font-size:1.4em;color:#667eea;font-weight:700">${gs.score} Punkte</p>`;
  h += `<p style="margin:10px 0">+${gs.score} XP gesammelt!</p>`;
  h += `<div class="btn-row" style="justify-content:center">`;
  h += `<button class="btn btn-primary" onclick="startGame('${gs.bid}','${gs.kid}')">Nochmal spielen</button>`;
  h += `<button class="btn btn-secondary" onclick="openKapitel('${gs.bid}','${gs.kid}')">Zurück zum Kapitel</button>`;
  h += `</div></div>`;
  main.innerHTML = h;
  updateStats();
}

renderHome();
